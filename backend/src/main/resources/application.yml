spring:
  application:
    name: caterhub-backend
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/caterhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://10.0.2.2,http://10.0.2.2:8080,http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

caterhub:
  bootstrap:
    admin:
      enabled: ${CATERHUB_BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${CATERHUB_BOOTSTRAP_ADMIN_EMAIL:admin@caterhub.in}
      username: ${CATERHUB_BOOTSTRAP_ADMIN_USERNAME:superadmin}
      password: ${CATERHUB_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
      phone-number: ${CATERHUB_BOOTSTRAP_ADMIN_PHONE:+919999999999}
      first-name: ${CATERHUB_BOOTSTRAP_ADMIN_FIRST_NAME:System}
      last-name: ${CATERHUB_BOOTSTRAP_ADMIN_LAST_NAME:Admin}

jwt:
  secret: ${JWT_SECRET:ChangeThisDevelopmentOnlyJwtSecretAtLeast32BytesLong}
  expiration: ${JWT_EXPIRATION_MS:900000}  # 15 minutes
  refreshExpiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

otp:
  dev:
    mode: ${OTP_DEV_MODE:false}
    code: ${OTP_DEV_CODE:123456}
  expiration:
    seconds: ${OTP_EXPIRATION_SECONDS:300}
  resend:
    cooldown:
      seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  rate-limit:
    mobile:
      window-seconds: ${OTP_RATE_LIMIT_MOBILE_WINDOW_SECONDS:3600}
      max-sends: ${OTP_RATE_LIMIT_MOBILE_MAX_SENDS:5}
    ip:
      window-seconds: ${OTP_RATE_LIMIT_IP_WINDOW_SECONDS:3600}
      max-sends: ${OTP_RATE_LIMIT_IP_MAX_SENDS:20}
  sms:
    enabled: ${OTP_SMS_ENABLED:true}
  voice:
    # Enable voice-call OTP fallback if provider is configured and account supports it
    enabled: ${OTP_VOICE_ENABLED:false}
    # Separate rate-limits for voice fallback
    rate-limit:
      window-seconds: ${OTP_VOICE_RATE_LIMIT_WINDOW_SECONDS:3600}
      max-calls: ${OTP_VOICE_RATE_LIMIT_MAX_CALLS:2}

twofactor:
  api-key: ${TWOFACTOR_API_KEY:}
  base-url: ${TWOFACTOR_BASE_URL:https://2factor.in}
  timeout-seconds: ${TWOFACTOR_TIMEOUT_SECONDS:30}
  sender-id: ${TWOFACTOR_SENDER_ID:}
  # Approved 2Factor/DLT OTP template name. OTP is sent as var1.
  otp-template: ${TWOFACTOR_OTP_TEMPLATE:${SMS_PROVIDER_TEMPLATE_ID:}}

logging:
  level:
    root: INFO
    com.daily.cetaring: DEBUG
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
