services:
  mysql:
    image: mysql:8.4
    container_name: cetaring-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: caterhub
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - caterhub_dev_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: 007664619229.dkr.ecr.us-east-1.amazonaws.com/cetaring-dev:latest
    container_name: caterhub-dev-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/caterhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: SuperSecretKeyForJWTThatMustBe32BytesLongForHS256
      SERVER_PORT: 8080
      CATERHUB_BOOTSTRAP_ADMIN_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - caterhub_dev_network

  gateway:
    image: nginx:1.27-alpine
    container_name: caterhub-dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-dist:/usr/share/nginx/html/web:ro
      - ./admin-dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - backend
    networks:
      - caterhub_dev_network

networks:
  caterhub_dev_network:
    driver: bridge

volumes:
  mysql_data:
